name: Terraform Apply - RDS

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Confirma a criação/atualização do RDS (consome crédito do Learner Lab)? Requer o infra-kubernetes já aplicado."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

jobs:
  terraform-apply:
    name: Provisionar RDS via Terraform
    runs-on: ubuntu-latest
    environment: aws-deploy
    permissions:
      contents: read
    steps:
      - name: Verificar confirmação de apply
        run: |
          if [ "${{ github.event.inputs.confirm_apply }}" != "yes" ]; then
            echo "::error::Apply não confirmado (confirm_apply='${{ github.event.inputs.confirm_apply }}'). Selecione 'yes' para prosseguir."
            exit 1
          fi
          echo "Apply confirmado, prosseguindo."

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.x"

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        env:
          TF_VAR_db_username: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -input=false -out=tfplan

      - name: Upload do plano como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 7

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Exibir outputs do Terraform
        run: |
          echo "===== Todos os outputs ====="
          terraform output
          echo ""
          echo "===== Copie para os secrets do TechChallenger-Api ====="
          echo "-> secret DB_HOST (output rds_address):"
          terraform output -raw rds_address
          echo ""
          echo "-> secret DB_NAME (output db_name):"
          terraform output -raw db_name
          echo ""
